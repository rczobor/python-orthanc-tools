[tox]
envlist = py{311,312,313,314}
minversion = 4.0
isolated_build = true

[testenv]
package = wheel
commands =
    python -m unittest discover -s tests
    python -m unittest discover -s orthanc_tools/hl7Lib/tests

# Destructive Docker integrations stay opt-in and are run only on an isolated daemon.
passenv =
    ORTHANC_TEST_ALLOW_DELETE
