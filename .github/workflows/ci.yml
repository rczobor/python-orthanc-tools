name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install reviewed dependencies and build tools
        run: python -m pip install --require-hashes -r requirements.lock -r requirements-build.lock

      - name: Build source and wheel distributions
        run: python -m build --no-isolation

      - name: Run unit and regression tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -s tests
          python -m unittest discover -s orthanc_tools/hl7Lib/tests

  mp-docker-forwarder:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build the production image
        run: docker build --build-arg VCS_REF="$GITHUB_SHA" --tag python-orthanc-tools:ci .

      - name: Run unit tests in the production image
        run: >-
          docker run --rm
          --mount type=bind,source="$PWD",target=/work,readonly
          python-orthanc-tools:ci
          python -m unittest discover -s /work/tests

      - name: Run the mp-docker forwarding workflow
        run: |
          docker compose --project-name mp-forwarder-ci -f tests/docker-setup/docker-compose.yml -f tests/docker-setup/maintenance.yml up -d

          docker run -d \
            --name mp-forwarder-ci-forwarder \
            --network mp-forwarder-ci_default \
            -e SOURCE_URL=http://orthanc-a:8042 \
            -e SOURCE_USER=test \
            -e SOURCE_PWD=test \
            -e DESTINATIONS=orthanc-b:peering,orthanc-c:dicom:substring:RTG \
            -e TRIGGER=StableStudy \
            -e WORKER_THREADS_COUNT=6 \
            -e POLLING_INTERVAL=1 \
            -e HEARTBEAT_FILE=/tmp/forwarder-heartbeat \
            --health-cmd 'test -f /tmp/forwarder-heartbeat && find /tmp/forwarder-heartbeat -mmin -1 | grep -q .' \
            --health-interval 2s \
            --health-timeout 2s \
            --health-retries 15 \
            python-orthanc-tools:ci \
            python -u -m orthanc_tools.orthanc_forwarder

          for _ in {1..30}; do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' mp-forwarder-ci-forwarder)" = healthy ]; then
              break
            fi
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' mp-forwarder-ci-forwarder)" = healthy

          docker run --rm \
            --network mp-forwarder-ci_default \
            --mount type=bind,source="$PWD",target=/work,readonly \
            -e ORTHANC_SOURCE_URL=http://orthanc-a:8042 \
            -e ORTHANC_ALWAYS_DESTINATION_URL=http://orthanc-b:8042 \
            -e ORTHANC_FILTERED_DESTINATION_URL=http://orthanc-c:8042 \
            -e ORTHANC_TEST_ALLOW_DELETE=1 \
            python-orthanc-tools:ci \
            python /work/tests/test_mp_docker_forwarder.py

      - name: Run forwarding failure and recovery scenarios
        run: |
          docker rm --force mp-forwarder-ci-forwarder
          docker run --rm \
            --network mp-forwarder-ci_default \
            --mount type=bind,source="$PWD",target=/work,readonly \
            -e ORTHANC_SOURCE_URL=http://orthanc-a:8042 \
            -e ORTHANC_ALWAYS_DESTINATION_URL=http://orthanc-b:8042 \
            -e ORTHANC_FILTERED_DESTINATION_URL=http://orthanc-c:8042 \
            -e ORTHANC_TEST_ALLOW_DELETE=1 \
            python-orthanc-tools:ci \
            python -m unittest discover -s /work/tests -p "test_forwarder_integration.py"

      - name: Show integration logs after failure
        if: failure()
        run: |
          docker logs mp-forwarder-ci-forwarder || true
          docker compose --project-name mp-forwarder-ci -f tests/docker-setup/docker-compose.yml -f tests/docker-setup/maintenance.yml logs || true

      - name: Clean up integration containers
        if: always()
        run: |
          docker rm --force mp-forwarder-ci-forwarder 2>/dev/null || true
          docker compose --project-name mp-forwarder-ci -f tests/docker-setup/docker-compose.yml -f tests/docker-setup/maintenance.yml down --volumes
